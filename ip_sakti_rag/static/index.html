<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IP-SAKTI Sahayak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F5F7F4; --surface:#FFFFFF; --surface-2:#FAFBFA;
  --ink:#17203A; --ink-2:#4A5470; --ink-3:#7C849A;
  --line:#E2E6EC; --line-2:#D3D9E1;
  --leaf:#2F6B4F; --leaf-soft:#E4EFE8; --leaf-deep:#1F4D38;
  --indigo:#34449A; --indigo-soft:#E8EBF8;
  --haldi:#A8700A; --haldi-soft:#FBF1DC;
  --rose:#A63D37; --rose-soft:#F9E6E4;
  --ui:"Manrope","Noto Sans Devanagari","Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Newsreader","Noto Sans Devanagari",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:6px}
a{color:var(--indigo)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Background */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(23,32,58,.075) 1px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 55% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 55% 40%,#000 20%,transparent 75%)}
.bg .aura{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.bg .a1{width:520px;height:520px;background:#D3E7DA;top:-140px;right:12%}
.bg .a2{width:460px;height:460px;background:#DDE1F6;bottom:-160px;left:22%}
.bg .a3{width:260px;height:260px;background:#F6E9C8;top:42%;right:-60px;opacity:.55}
.bg svg.leaf{position:absolute;right:max(3vw,340px);bottom:-60px;width:min(46vw,560px);height:auto;opacity:.9}
.leaf path{fill:none;stroke:var(--leaf);stroke-linecap:round}
.leaf .outline{stroke-width:1.4;opacity:.20}
.leaf .rib{stroke-width:1.2;opacity:.18}
.leaf .vein{stroke-width:.9;opacity:.13}
@media (prefers-reduced-motion:no-preference){
  .bg .a1{animation:drift1 38s ease-in-out infinite alternate}
  .bg .a2{animation:drift2 44s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(-90px,70px) scale(1.08)}}
  @keyframes drift2{to{transform:translate(110px,-60px) scale(.94)}}
}

/* Shell */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:272px minmax(0,1fr) 336px}
.side{border-right:1px solid var(--line);background:rgba(255,255,255,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;padding:20px 16px;gap:22px;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-size:12px;color:var(--ink-3);line-height:1.3}
.btn-new{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:600;font-size:14px;transition:background .15s}
.btn-new:hover{background:#26315A}
.group h2{font-size:12px;font-weight:600;color:var(--ink-3);margin:0 0 6px 8px;letter-spacing:.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:9px;font-size:14px;color:var(--ink-2)}
.nav button:hover{background:rgba(23,32,58,.05);color:var(--ink)}
.nav .hist{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.plan{margin-top:auto;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px}
.plan .tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--leaf-deep);background:var(--leaf-soft);border-radius:999px;padding:2px 9px}
.plan p{margin:8px 0 12px;font-size:13px;color:var(--ink-2);line-height:1.45}
.plan button{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px;font-size:13.5px;font-weight:600}
.plan button:hover{border-color:var(--ink-3)}

.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid transparent}
.menu-btn{display:none;background:none;border:0;padding:6px;border-radius:8px}
.seg{display:inline-flex;background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg .flag{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.7}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--leaf);display:block}
.lang{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:10px;padding:0 4px 0 10px;color:var(--ink-2)}
.lang select{border:0;background:transparent;padding:7px 4px;font-size:13.5px;font-weight:600;color:var(--ink);outline:none}

.thread{flex:1;overflow-y:auto;padding:8px 24px 24px}
.inner{max-width:760px;margin:0 auto}

/* Welcome */
.welcome{padding:6vh 0 10px}
.welcome h1{font-family:var(--read);font-weight:400;font-size:clamp(32px,4.4vw,48px);line-height:1.08;letter-spacing:-.02em;margin:0 0 14px;max-width:16ch}
.welcome .lede{font-size:16px;color:var(--ink-2);max-width:56ch;margin:0 0 28px}
.classify{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:26px;transition:border-color .15s}
.classify:hover{border-color:var(--leaf)}
.classify .ico{width:44px;height:44px;border-radius:12px;background:var(--leaf-soft);color:var(--leaf-deep);display:grid;place-items:center;flex:none}
.classify b{display:block;font-size:15px}
.classify span{font-size:13.5px;color:var(--ink-2)}
.classify .go{margin-left:auto;font-size:13px;font-weight:600;color:var(--leaf-deep);white-space:nowrap}
.sugg-h{font-size:13px;color:var(--ink-3);margin:0 0 10px;font-weight:600}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sugg button{text-align:left;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:14px;color:var(--ink);line-height:1.4}
.sugg button:hover{background:var(--surface);border-color:var(--line-2)}
.sugg small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}

/* Messages */
.msg{margin:26px 0}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.bubble{background:var(--ink);color:#fff;padding:11px 16px;border-radius:16px 16px 4px 16px;max-width:78%;font-size:15px}
.trans{font-size:12.5px;color:var(--ink-3);margin-top:6px;max-width:78%;text-align:right}
.bot{display:flex;gap:14px}
.avatar{width:32px;height:32px;flex:none;margin-top:2px}
.card{flex:1;min-width:0;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:18px 20px}
.pipe{display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--ink-3)}
.pipe div{display:flex;align-items:center;gap:10px;transition:color .2s}
.pipe .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.pipe .on{color:var(--ink)}
.pipe .on .dot{border-color:var(--indigo);border-top-color:transparent}
@media (prefers-reduced-motion:no-preference){.pipe .on .dot{animation:spin .8s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.pipe .done{color:var(--ink-2)}
.pipe .done .dot{background:var(--leaf);border-color:var(--leaf)}
.pipe .done .dot::after{content:"";width:6px;height:3px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.answer{font-family:var(--read);font-size:17.5px;line-height:1.65;color:var(--ink)}
.answer p{margin:0 0 12px}
.answer ul{margin:0 0 12px;padding-left:20px}
.answer li{margin-bottom:6px}
.answer strong{font-weight:500;background:linear-gradient(transparent 62%,var(--haldi-soft) 62%)}
sup.cite{font-family:var(--ui);font-size:11px;font-weight:700;color:var(--indigo);background:var(--indigo-soft);border-radius:5px;padding:1px 5px;margin-left:2px;cursor:pointer;vertical-align:3px}
sup.cite:hover{background:var(--indigo);color:#fff}
.conf{display:flex;align-items:center;gap:12px;margin:16px 0 4px;padding-top:14px;border-top:1px solid var(--line);font-size:13px}
.conf .bar{flex:1;max-width:180px;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.conf .bar i{display:block;height:100%;border-radius:999px;transition:width .8s ease}
.conf b{font-weight:600}
.conf .why{color:var(--ink-3)}
.lvl-high{color:var(--leaf-deep)} .lvl-high .bar i{background:var(--leaf)}
.lvl-med{color:var(--haldi)} .lvl-med .bar i{background:#D8A032}
.lvl-low{color:var(--rose)} .lvl-low .bar i{background:var(--rose)}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.srcs button{font-size:12px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:4px 9px;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcs button b{color:var(--indigo);margin-right:4px}
.escal{margin-top:14px;background:var(--rose-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;color:#6E2622;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.escal p{margin:0;flex:1;min-width:200px}
.actions{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.act:hover{border-color:var(--line-2);color:var(--ink)}
.act.expert{background:var(--ink);color:#fff;border-color:var(--ink)}
.act.expert:hover{background:#26315A;color:#fff}
.act svg.i{width:15px;height:15px}

/* Composer */
.composer{padding:10px 24px 18px}
.box{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 1px 0 rgba(23,32,58,.03),0 12px 32px -18px rgba(23,32,58,.25);transition:border-color .15s}
.box:focus-within{border-color:var(--indigo)}
.box textarea{flex:1;border:0;outline:none;resize:none;background:transparent;font-size:15px;line-height:1.5;padding:7px 0;max-height:160px}
.icon-btn{width:38px;height:38px;border-radius:11px;border:0;display:grid;place-items:center;background:transparent;color:var(--ink-2);flex:none}
.icon-btn:hover{background:rgba(23,32,58,.06)}
.icon-btn.send{background:var(--leaf);color:#fff}
.icon-btn.send:hover{background:var(--leaf-deep)}
.icon-btn.mic.live{background:var(--rose-soft);color:var(--rose)}
@media (prefers-reduced-motion:no-preference){.icon-btn.mic.live{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(166,61,55,.12)}}
.fine{max-width:760px;margin:8px auto 0;font-size:12px;color:var(--ink-3);text-align:center}

/* Right panel */
.panel{border-left:1px solid var(--line);background:rgba(255,255,255,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:20px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:22px}
.panel h2{font-size:13px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}
.panel h2 span{font-weight:500;color:var(--ink-3);font-size:12px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px}
.prod.empty{text-align:left;color:var(--ink-2);font-size:13.5px}
.prod.empty button{margin-top:10px;border:1px solid var(--leaf);color:var(--leaf-deep);background:var(--leaf-soft);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px}
.prod .cat{font-family:var(--read);font-size:22px;line-height:1.2;margin:2px 0 12px}
.prod dl{margin:0;display:grid;gap:10px}
.prod dt{font-size:11.5px;color:var(--ink-3);font-weight:600}
.prod dd{margin:1px 0 0;font-size:13.5px;color:var(--ink)}
.src{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:8px;transition:border-color .2s,box-shadow .2s}
.src.hl{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-soft)}
.src .row{display:flex;gap:10px;align-items:flex-start}
.src .n{font-size:11px;font-weight:700;color:var(--indigo);background:var(--indigo-soft);border-radius:6px;min-width:22px;height:20px;display:grid;place-items:center;flex:none}
.src b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.src .sec{font-size:13px;color:var(--ink-2)}
.src .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--leaf-soft);color:var(--leaf-deep)}
.pill.intl{background:var(--indigo-soft);color:var(--indigo)}
.pill.warn{background:var(--haldi-soft);color:var(--haldi)}
.src a{font-size:12px;font-weight:600;margin-left:auto;text-decoration:none}
.src a:hover{text-decoration:underline}
.empty-note{font-size:13.5px;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:12px;padding:14px}
.helpers{display:grid;gap:8px}
.helpers button{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13.5px;text-align:left;color:var(--ink)}
.helpers button:hover{border-color:var(--line-2)}
.helpers small{display:block;color:var(--ink-3);font-size:12px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(23,32,58,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:20px;width:min(520px,100%);max-height:88vh;overflow-y:auto;padding:24px;position:relative;box-shadow:0 30px 80px -30px rgba(23,32,58,.45)}
.modal h3{font-family:var(--read);font-weight:400;font-size:26px;line-height:1.2;margin:0 0 6px;padding-right:36px}
.modal .sub{color:var(--ink-2);font-size:14px;margin:0 0 18px}
.close{position:absolute;top:16px;right:16px}
.steps{display:flex;gap:5px;margin-bottom:18px}
.steps i{height:4px;flex:1;border-radius:999px;background:var(--line)}
.steps i.on{background:var(--leaf)}
.q{font-size:17px;font-weight:600;margin:0 0 14px;line-height:1.35}
.opts{display:grid;gap:8px}
.opts button{text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14.5px}
.opts button:hover{border-color:var(--leaf);background:var(--leaf-soft)}
.opts small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.result .cat{font-family:var(--read);font-size:28px;margin:4px 0 14px;line-height:1.15}
.result dl{margin:0 0 18px;display:grid;gap:12px}
.result dt{font-size:12px;color:var(--ink-3);font-weight:600}
.result dd{margin:2px 0 0;font-size:14px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.primary{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px}
.primary:hover{background:#26315A}
.ghost{background:none;border:1px solid var(--line-2);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px}
.expert-row{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.expert-row:has(input:checked){border-color:var(--indigo);background:var(--indigo-soft)}
.expert-row input{accent-color:var(--indigo)}
.expert-row b{display:block;font-size:14px}
.expert-row span{font-size:12.5px;color:var(--ink-2)}
.price{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.price b{font-size:20px;color:var(--ink);font-weight:700}
.links{display:grid;gap:8px}
.links a{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;text-decoration:none;color:var(--ink)}
.links a:hover{border-color:var(--indigo)}
.links b{display:block;font-size:14px}
.links span{font-size:12.5px;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

@media (max-width:1180px){
  .app{grid-template-columns:260px minmax(0,1fr)}
  .panel{display:none}
  .bg svg.leaf{right:2vw}
}
@media (max-width:780px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;left:0;bottom:0;width:282px;z-index:40;transform:translateX(-100%);transition:transform .25s;background:rgba(255,255,255,.96);padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(23,32,58,.25);z-index:39}
  .menu-btn{display:grid;place-items:center}
  .top{padding:10px 14px;gap:8px;flex-wrap:wrap}
  .chip{display:none}
  .thread{padding:4px 14px 18px}
  .composer{padding:8px 12px 12px}
  .sugg{grid-template-columns:1fr}
  .bubble,.trans{max-width:90%}
  .avatar{display:none}
  .card{padding:15px 16px}
  .answer{font-size:16.5px}
  .classify .go{display:none}
}

:root{--ui:"Manrope","Noto Sans Devanagari","Noto Sans Gujarati","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;--read:"Newsreader","Noto Sans Devanagari","Noto Sans Gujarati","Noto Sans Tamil",Georgia,"Times New Roman",serif}
html:not([lang="en"]) .answer{font-size:16px;line-height:1.9}
html:not([lang="en"]) .welcome h1{font-size:clamp(26px,3.4vw,38px);line-height:1.35;max-width:24ch;letter-spacing:0}
html:not([lang="en"]) .prod .cat,html:not([lang="en"]) .result .cat{font-size:20px;line-height:1.4}
html:not([lang="en"]) .modal h3{font-size:22px;line-height:1.4}
html[lang="ta"] body{font-size:14px}
.escal small{opacity:.75}
.chip.off i{background:var(--rose)}.chip.off{color:var(--rose)}
.chip.wait i{background:#D8A032}
.how{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:var(--ink-2)}

/* ================= Matte glass theme ================= */
:root{
  --mist:#EDF1EC; --haldi-2:#C99A2E;
  --glass:rgba(255,255,255,.56); --glass-hi:rgba(255,255,255,.74); --glass-lo:rgba(255,255,255,.42);
  --glass-line:rgba(255,255,255,.75); --glass-edge:rgba(23,32,58,.07);
  --blur:blur(22px) saturate(150%);
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.09  0 0 0 0 0.12  0 0 0 0 0.2  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --lift:0 1px 0 rgba(255,255,255,.9) inset,0 0 0 1px var(--glass-edge),0 24px 48px -30px rgba(23,32,58,.32);
  --lift-sm:0 1px 0 rgba(255,255,255,.85) inset,0 0 0 1px var(--glass-edge),0 10px 22px -18px rgba(23,32,58,.28);
}
body{background:var(--mist)}

/* Ground: botanical line art + soft light */
.bg .aura{filter:blur(80px)}
.bg .a1{width:640px;height:640px;background:#C9E1D1;opacity:.95;top:-200px;right:18%}
.bg .a2{width:600px;height:600px;background:#D3D9F3;opacity:.9;bottom:-220px;left:12%}
.bg .a3{width:380px;height:380px;background:#F1E0B8;opacity:.6;top:34%;right:-80px}
.bg .dots{opacity:.7}
.bg svg.leaf{opacity:1;right:max(2vw,300px);bottom:-80px;width:min(52vw,640px)}
.bg svg.leaf2{position:absolute;left:-120px;top:-60px;width:min(34vw,420px);height:auto;transform:rotate(-28deg)}
.leaf .outline{opacity:.28;stroke-width:1.5}
.leaf .rib{opacity:.26}
.leaf .vein{opacity:.2;stroke-width:1}
body::after{content:"";position:fixed;inset:0;background-image:var(--noise);opacity:.55;pointer-events:none;z-index:0}

/* Floating panes */
.app{gap:14px;padding:14px;grid-template-columns:264px minmax(0,1fr) 340px}
.side,.panel{border:0;border-radius:22px;background-color:var(--glass);background-image:var(--noise);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--lift)}
.side{padding:18px 14px}
.panel{padding:18px 16px}
.main{min-height:0}

/* Top bar */
.top{margin:0 0 4px;padding:8px 10px;border-radius:18px;background-color:var(--glass-lo);background-image:var(--noise);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--lift-sm)}
.seg,.lang,.chip{background:rgba(255,255,255,.62);border-color:rgba(255,255,255,.8);box-shadow:0 0 0 1px var(--glass-edge)}
.seg button[aria-pressed="true"]{background:var(--ink);box-shadow:0 6px 14px -8px rgba(23,32,58,.6)}

/* Sidebar */
.btn-new{border-radius:12px;box-shadow:0 10px 20px -12px rgba(23,32,58,.55)}
.nav button:hover{background:rgba(255,255,255,.55)}
.plan{background:rgba(255,255,255,.5);border:0;box-shadow:var(--lift-sm)}

/* Welcome */
.welcome{padding:7vh 0 10px}
.welcome h1{font-size:clamp(34px,4.3vw,52px);letter-spacing:-.025em;max-width:15ch}
.classify,.sugg button{border:0;background-color:var(--glass);background-image:var(--noise);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--lift-sm)}
.classify{border-radius:18px}
.classify:hover,.sugg button:hover{background-color:var(--glass-hi)}
.classify .ico{background:rgba(47,107,79,.12)}
.sugg button{border-radius:16px}

/* Messages */
.bubble{background:rgba(23,32,58,.9);backdrop-filter:blur(10px);box-shadow:0 12px 24px -16px rgba(23,32,58,.7);border-radius:18px 18px 6px 18px}
.card{border:0;border-radius:6px 20px 20px 20px;background-color:var(--glass-hi);background-image:var(--noise);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--lift);padding:20px 22px}
.answer{color:var(--ink)}
.conf{border-top-color:rgba(23,32,58,.08)}
.conf .bar{background:rgba(23,32,58,.08)}
.lvl-med .bar i{background:var(--haldi-2)}
.act{background:rgba(255,255,255,.66);border-color:rgba(255,255,255,.85);box-shadow:0 0 0 1px var(--glass-edge)}
.act.expert{background:var(--ink);box-shadow:none}
.escal{background:rgba(249,230,228,.75);border-radius:14px;box-shadow:0 0 0 1px rgba(166,61,55,.12)}
.how{border-top-color:rgba(23,32,58,.09)}

/* Documents used (grouped by PDF) */
.used{margin-top:14px;border-radius:16px;background:rgba(255,255,255,.5);box-shadow:0 0 0 1px var(--glass-edge);padding:12px}
.used-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 2px 10px}
.used-h span{font-weight:500;color:var(--ink-3)}
.used-doc{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:12px;background:rgba(255,255,255,.62);box-shadow:0 0 0 1px var(--glass-edge)}
.used-doc+.used-doc{margin-top:8px}
.pdf-ic{width:34px;height:40px;flex:none;border-radius:6px;background:linear-gradient(180deg,#fff,#F1F3F6);box-shadow:0 0 0 1px rgba(23,32,58,.12);position:relative;display:grid;place-items:end center;padding-bottom:5px;font-size:8.5px;font-weight:800;color:var(--rose);letter-spacing:.02em}
.pdf-ic::before{content:"";position:absolute;top:0;right:0;width:10px;height:10px;background:linear-gradient(225deg,var(--mist) 50%,#DDE2E8 50%);border-bottom-left-radius:3px}
.pdf-ic::after{content:"";position:absolute;left:7px;right:7px;top:12px;height:10px;background:repeating-linear-gradient(180deg,rgba(23,32,58,.18) 0 1.5px,transparent 1.5px 4px)}
.ud-main{flex:1;min-width:0}
.ud-main b{display:block;font-size:13.5px;line-height:1.35}
.ud-file{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ud-cites{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ud-cites button{font-size:12px;border:0;background:var(--indigo-soft);color:var(--ink);border-radius:8px;padding:3px 8px 3px 4px;display:inline-flex;align-items:center;gap:6px}
.ud-cites button b{display:grid;place-items:center;min-width:18px;height:18px;border-radius:5px;background:var(--indigo);color:#fff;font-size:10.5px}
.ud-cites button:hover{background:#DCE1F6}
.ud-open{flex:none;align-self:center;font-size:12.5px;font-weight:700;text-decoration:none;color:var(--indigo);padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.8);box-shadow:0 0 0 1px var(--glass-edge)}
.ud-open:hover{background:#fff}
.ud-tags{display:inline-flex;gap:5px;margin-left:6px;vertical-align:1px}
.ud-tags .pill{font-size:10.5px;padding:1px 7px}

/* Composer */
.composer{padding:8px 0 4px}
.box{border:0;border-radius:22px;background-color:var(--glass-hi);background-image:var(--noise);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--lift)}
.box:focus-within{box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 0 0 2px rgba(52,68,154,.35),0 24px 48px -30px rgba(23,32,58,.32)}
.thread{padding:8px 14px 18px}

/* Right panel cards */
.prod,.src,.helpers button,.empty-note{border:0;background:rgba(255,255,255,.6);box-shadow:0 0 0 1px var(--glass-edge)}
.empty-note{border:0}
.src.hl{box-shadow:0 0 0 2px var(--indigo),0 0 0 6px var(--indigo-soft)}
.prod.empty button{border:0;background:rgba(47,107,79,.12)}

/* Modals and toast */
.overlay{background:rgba(23,32,58,.16);backdrop-filter:blur(8px) saturate(120%);-webkit-backdrop-filter:blur(8px) saturate(120%)}
.modal{background-color:rgba(255,255,255,.8);background-image:var(--noise);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--lift);border-radius:24px}
.opts button,.expert-row,.links a,.doc{border:0;background:rgba(255,255,255,.66);box-shadow:0 0 0 1px var(--glass-edge)}
.opts button:hover{background:rgba(228,239,232,.9)}
.expert-row:has(input:checked){box-shadow:0 0 0 2px var(--indigo)}
.excerpt{border:0;background:rgba(255,255,255,.66);box-shadow:0 0 0 1px var(--glass-edge)}
.toast{background:rgba(23,32,58,.9);backdrop-filter:blur(10px)}

@media (max-width:1180px){.app{grid-template-columns:250px minmax(0,1fr)}}
@media (max-width:780px){
  .app{grid-template-columns:minmax(0,1fr);padding:8px;gap:8px}
  .side{top:8px;left:8px;bottom:8px;border-radius:20px;background-color:rgba(255,255,255,.86)}
  .top{border-radius:14px}
  .used-doc{flex-wrap:wrap}.ud-open{margin-left:46px}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .side,.panel,.card,.box,.modal,.top{background-color:rgba(255,255,255,.9)}
}

(function(){

const HKEY='ipsakti.history';let history=[];try{history=JSON.parse(localStorage.getItem(HKEY)||'[]');}catch(e){history=[];}
const t=k=>T[LANG][k];

/* Leaf background */

function P(d,c){const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class',c);leaf.appendChild(p);paths.push(p);}
P('M300 30 C 480 170, 560 430, 300 790 C 40 430, 120 170, 300 30 Z','outline');P('M300 50 C 296 300, 304 520, 300 800','rib');
for(let k=0;k<9;k++){const y=120+k*68,s=Math.sin((k+1)/10*Math.PI)*210+30;
 P(`M300 ${y} C ${300-s*.35} ${y+10}, ${300-s*.75} ${y+40}, ${300-s} ${y+92}`,'vein');P(`M300 ${y} C ${300+s*.35} ${y+10}, ${300+s*.75} ${y+40}, ${300+s} ${y+92}`,'vein');
 if(k>0&&k<8){const sx=300-s*.55,sy=y+48;P(`M${sx} ${sy} q -18 -4 -34 -26`,'vein');P(`M${600-sx} ${sy} q 18 -4 34 -26`,'vein');}}
(function(){const l2=document.createElementNS(NS,'svg');l2.setAttribute('viewBox','0 0 600 820');l2.setAttribute('class','leaf leaf2');l2.setAttribute('aria-hidden','true');
  l2.innerHTML=leaf.innerHTML;document.querySelector('.bg').appendChild(l2);})();
if(!reduce){paths.forEach((p,i)=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.style.transition=`stroke-dashoffset ${1.6+(i%5)*.25}s ease ${.15+i*.04}s`;});
 requestAnimationFrame(()=>requestAnimationFrame(()=>paths.forEach(p=>p.style.strokeDashoffset=0)));}

/* Language */
function applyLang(){
  document.documentElement.lang=LANG;$('lang').value=LANG;
  document.querySelectorAll('[data-t]').forEach(el=>{const v=t(el.dataset.t);if(typeof v==='string')el.textContent=v;});

  $('input').placeholder=t('ph');
  renderProd();renderSources(curRes);refreshStatusText();
  cards.forEach(c=>renderAnswer(c.card,c.res,false));
}
function setLang(l){if(!T[l]||l===LANG)return;LANG=l;applyLang();}
$('lang').addEventListener('change',e=>{setLang(e.target.value);toast(t('langSet'));});
function detect(q){
  if(/[\u0A80-\u0AFF]/.test(q))return'gu';if(/[\u0B80-\u0BFF]/.test(q))return'ta';
  if(/[\u0900-\u097F]/.test(q))return(LANG==='mr'||/आहे|मला|माझ्या|माझे|लागेल|येईल|साठी|शकतो|असलेल/.test(q))?'mr':'hi';
  if(/[a-z]{3,}/i.test(q))return'en';return LANG;}

document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{J=b.dataset.j;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));toast(t(J==='in'?'tIn':'tIntl'));}));

/* Chat */
const msgs=$('msgs'),thread=$('thread'),input=$('input');
function scrollEnd(){thread.scrollTo({top:thread.scrollHeight,behavior:reduce?'auto':'smooth'});}
const AV='<svg class="avatar" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#E4EFE8"/><path d="M17 8c5.4 4.2 6 10.4 0 18c-6-7.6-5.4-13.8 0-18z" fill="none" stroke="#2F6B4F" stroke-width="1.5"/><path d="M17 10.5v14" stroke="#2F6B4F" stroke-width="1"/></svg>';

async function ask(q,opts){
  opts=opts||{};
  if(busy||!q.trim())return;
  if(!opts.keep)setLang(detect(q));
  busy=true;lastQ=q;$('welcome').style.display='none';
  const u=document.createElement('div');u.className='msg user';
  u.innerHTML=`<div class="bubble">${esc(q)}</div>`+(/[\u0900-\u0BFF]/.test(q)?`<div class="trans">${esc(t('note'))}</div>`:'');
  msgs.appendChild(u);
  const m=document.createElement('div');m.className='msg bot';
  const st=t('steps'),steps=[st[0],J==='in'?st[1]:st[2],st[3],st[4]];
  m.innerHTML=AV+`<div class="card"><div class="pipe">${steps.map(s=>`<div><span class="dot"></span>${esc(s)}</div>`).join('')}</div></div>`;
  msgs.appendChild(m);scrollEnd();
  const card=m.querySelector('.card'),rows=card.querySelectorAll('.pipe div');
  /* Progress animation while the server works (last step waits for the answer) */
  let i=0;rows[0].className='on';
  const timer=setInterval(()=>{if(i<rows.length-1){rows[i].className='done';i++;rows[i].className='on';}},reduce?300:1400);
  try{
    const r=await fetch(API+'/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q,jurisdiction:J==='in'?'IN':'INTL',language:LANG,
        product_category:prodKey?R[prodKey].en.c:null})});
    if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||('HTTP '+r.status));
    const res=await r.json();
    clearInterval(timer);
    if(res.language&&T[res.language]&&res.language!==LANG)setLang(res.language);
    lastRes=res;cards.push({card,res});renderAnswer(card,res,true);saveHistory(q,res);
  }catch(e){
    clearInterval(timer);
    card.innerHTML=`<div class="escal"><p>${esc(t('err'))}<br><small>${esc(e.message)}</small></p></div>`;
  }finally{busy=false;scrollEnd();}
}

function answerHtml(text){
  const paras=esc(text).split(/\n{2,}/).map(p=>p.trim()).filter(Boolean);
  return paras.map(p=>'<p>'+p.replace(/\s*\[(\d+)\]/g,(_,n)=>`<sup class="cite" data-n="${n}" tabindex="0">${n}</sup>`).replace(/\n/g,'<br>')+'</p>').join('');
}
function srcLine(s){return [s.section&&s.section!=='Preamble'?s.section:'',s.pages?('p. '+s.pages):''].filter(Boolean).join(', ');}

   ${docsUsed(res)}
   ${res.escalate?`<div class="escal"><p>${esc(t('escLow'))} ${esc(t('escRev'))}</p><button class="act expert" data-exp>${esc(t('askFor'))}</button></div>`:''}
   ${howFound(res)}
   <div class="actions">
    <button class="act" data-listen><svg class="i" viewBox="0 0 24 24"><path d="M5 10v4h3l5 4V6L8 10z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></svg>${esc(t('listen'))}</button>
    <button class="act" data-copy><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>${esc(t('copy'))}</button>
    ${res.escalate?'':`<button class="act" data-exp><svg class="i" viewBox="0 0 24 24"><circle cx="10" cy="8" r="4"/><path d="M3 20c0-3.5 3-6 7-6M15 18l2 2 4-4"/></svg>${esc(t('ask'))}</button>`}
    <span class="fb"><button class="act${res._fb==='up'?' on':''}" data-fb="up" aria-label="${esc(t('helpful'))}" title="${esc(t('helpful'))}"><svg class="i" viewBox="0 0 24 24"><path d="M7 11v9H4v-9zM7 11l4-8c1.7 0 3 1.3 3 3v3h5a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7"/></svg></button><button class="act${res._fb==='down'?' on':''}" data-fb="down" aria-label="${esc(t('notHelpful'))}" title="${esc(t('notHelpful'))}"><svg class="i" viewBox="0 0 24 24"><path d="M17 13V4h3v9zM17 13l-4 8c-1.7 0-3-1.3-3-3v-3H5a2 2 0 0 1-2-2.3l1.2-7A2 2 0 0 1 6.2 4H17"/></svg></button></span>
   </div>`;
  if(fresh)requestAnimationFrame(()=>{card.querySelector('.bar i').style.width=pct+'%';});

  card.querySelectorAll('[data-fb]').forEach(b=>b.addEventListener('click',()=>sendFeedback(res,b.dataset.fb,card)));
  card.querySelector('[data-copy]').addEventListener('click',()=>{const x=card.querySelector('.answer').innerText;try{navigator.clipboard.writeText(x).then(()=>toast(t('copied')),()=>toast(t('copyNo')));}catch(e){toast(t('copyNo'));}});
  card.querySelector('[data-listen]').addEventListener('click',()=>{try{const u=new SpeechSynthesisUtterance(card.querySelector('.answer').innerText);u.lang={en:'en-IN',hi:'hi-IN',gu:'gu-IN',mr:'mr-IN',ta:'ta-IN'}[res.language]||'en-IN';speechSynthesis.cancel();speechSynthesis.speak(u);toast(t('reading'));}catch(e){toast(t('audioNo'));}});
  if(fresh)show();
}

function renderSources(res){
  const cnt=$('srcCount'),list=$('srcList');
  if(!res){cnt.textContent=t('noneYet');list.innerHTML=`<div class="empty-note">${esc(t('srcEmpty'))}</div>`;return;}
  const srcs=res.sources||[];
  if(!srcs.length){cnt.textContent='';list.innerHTML=`<div class="empty-note">${esc(t('srcNone'))}</div>`;return;}
  cnt.textContent=srcs.length+' '+t('cited');
  list.innerHTML=srcs.map(s=>`<div class="src" id="src-${s.n}" data-src="${s.n}" tabindex="0" role="button"><div class="row"><span class="n">${s.n}</span><div><b>${esc(s.title||s.label)}</b><span class="sec">${esc(srcLine(s))}</span></div></div>
   ${s.excerpt?`<p class="sec" style="margin:8px 0 0;font-size:12.5px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${esc(s.excerpt)}</p>`:''}
   <div class="meta"><span class="pill ${s.jurisdiction==='INTL'?'intl':''}">${esc(t(s.jurisdiction==='INTL'?'pIntl':'pIn'))}</span>${s.is_current?`<span class="pill">${esc(t('pCur'))}</span>`:`<span class="pill warn">${esc(t('sup'))}</span>`}
   ${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(t('pOff'))}</a>`:`<span style="margin-left:auto;font-size:12px;color:var(--ink-3)">${esc(t('file'))}: ${esc(s.source_file)}</span>`}</div></div>`).join('');
  list.querySelectorAll('[data-src]').forEach(el=>{const s=srcs.find(x=>String(x.n)===el.dataset.src);const go=e=>{if(e.target.closest('a'))return;openSource(s);};el.addEventListener('click',go);el.addEventListener('keydown',e=>{if(e.key==='Enter')go(e);});});
}
function focusSrc(n,res){const el=$('src-'+n);
  if(el&&el.offsetParent!==null){document.querySelectorAll('.src.hl').forEach(x=>x.classList.remove('hl'));el.classList.add('hl');el.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});}
  else if(!document.querySelector('.modal.wide')&&!ov.classList.contains('open')){const s=(res.sources||[]).find(x=>String(x.n)===String(n));if(s)openSource(s);}}

function renderProd(){
  const p=$('prod');
  if(!prodKey){p.className='prod empty';p.innerHTML=`${esc(t('prodEmpty'))}<br><button data-tool="classify">${esc(t('tClassify'))}</button>`;return;}
  const r=R[prodKey],x=r[LANG],reg=r.reg?RG[r.reg][LANG]:x.r;
  p.className='prod';p.innerHTML=`<span class="pill">${esc(t('classified'))}</span><div class="cat">${esc(x.c)}</div><dl><div><dt>${esc(t('lReg'))}</dt><dd>${esc(reg)}</dd></div><div><dt>${esc(t('lIp'))}</dt><dd>${esc(x.ip)}</dd></div><div><dt>${esc(t('lAbs'))}</dt><dd>${esc(x.abs)}</dd></div></dl>`;
}

/* Composer */
function send(){const q=input.value.trim();if(!q)return;input.value='';input.style.height='auto';ask(q);}
$('send').addEventListener('click',send);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';});
const mic=$('mic');
mic.addEventListener('click',()=>{if(mic.classList.contains('live'))return;mic.classList.add('live');toast(t('listening'));
  setTimeout(()=>{mic.classList.remove('live');const l=LANG==='en'?'hi':LANG;ask(T[l].mic);},reduce?300:1600);});

document.addEventListener('click',e=>{
  const q=e.target.closest('[data-q]');if(q){closeSide();ask(q.dataset.q,{keep:!!q.dataset.keep});return;}
  const tl=e.target.closest('[data-tool]');if(tl){closeSide();tool(tl.dataset.tool);}
});
function tool(k){
  if(k==='classify')openClassifier();
  else if(k==='abs')ask(t('s2'),{keep:true});
  else if(k==='prior')openPrior();
  else if(k==='forms')openForms();
  else if(k==='library')openLibrary();
  else if(k==='desk')openDesk();
}
$('newBtn').addEventListener('click',()=>{msgs.innerHTML='';cards.length=0;$('welcome').style.display='';curRes=null;renderSources(null);closeSide();input.focus();});
$('proBtn').addEventListener('click',openPro);
const side=$('side'),scrim=$('scrim');
$('menuBtn').addEventListener('click',()=>{side.classList.add('open');scrim.classList.add('open');});
function closeSide(){side.classList.remove('open');scrim.classList.remove('open');}
scrim.addEventListener('click',closeSide);

/* Modals */
const ov=$('overlay'),md=$('modal');let lastFocus=null;
const X='<button class="icon-btn close" aria-label="Close" data-close><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
function openModal(h){lastFocus=document.activeElement;md.classList.remove('wide');md.innerHTML=X+h;ov.classList.add('open');const f=md.querySelector('button:not([data-close]),a');f&&f.focus();}
function closeModal(){ov.classList.remove('open');lastFocus&&lastFocus.focus&&lastFocus.focus();}
ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('open'))closeModal();});

function openClassifier(){renderQ('use');}
function renderQ(k){const q=Q[k];
  openModal(`<h3>${esc(t('clsH'))}</h3><p class="sub">${esc(t('clsSub'))}</p><div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=q.n?'on':''}"></i>`).join('')}</div>
   <p class="q">${esc(q.t[LANG])}</p><div class="opts">${q.o.map(o=>`<button data-next="${o[0]}">${esc(o[1][LANG][0])}<small>${esc(o[1][LANG][1])}</small></button>`).join('')}</div>`);
  md.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.next;Q[n]?renderQ(n):showResult(n);}));}
function showResult(k){const r=R[k],x=r[LANG],reg=r.reg?RG[r.reg][LANG]:x.r;
  openModal(`<div class="result"><p class="sub" style="margin:0">${esc(t('resLead'))}</p><div class="cat">${esc(x.c)}</div>
   <dl><div><dt>${esc(t('lReg'))}</dt><dd>${esc(reg)}</dd></div><div><dt>${esc(t('lLaw'))}</dt><dd>${esc(x.law)}</dd></div><div><dt>${esc(t('lIp'))}</dt><dd>${esc(x.ip)}</dd></div><div><dt>${esc(t('lAbs'))}</dt><dd>${esc(x.abs)}</dd></div></dl>
   <div class="row-btns"><button class="primary" data-save>${esc(t('useThis'))}</button><button class="ghost" data-restart>${esc(t('restart'))}</button></div></div>`);
  md.querySelector('[data-restart]').addEventListener('click',openClassifier);
  md.querySelector('[data-save]').addEventListener('click',()=>{prodKey=k;renderProd();closeModal();toast(t('saved')+' '+x.c);});}

function openExpert(res){
  res=res||lastRes;
  openModal(`<h3>${esc(t('exH'))}</h3><p class="sub">${esc(t('exSub'))}</p>
   <p class="sub" style="background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)">${esc((res&&res.question)||lastQ||t('yourQ'))}</p>
   <label class="expert-row"><input type="radio" name="ex" value="ip_attorney" checked><div><b>${esc(t('exA'))}</b><span>${esc(t('exAS'))}</span></div></label>
   <label class="expert-row"><input type="radio" name="ex" value="regulatory"><div><b>${esc(t('exR'))}</b><span>${esc(t('exRS'))}</span></div></label>
   <label class="expert-row"><input type="radio" name="ex" value="abs"><div><b>${esc(t('exB'))}</b><span>${esc(t('exBS'))}</span></div></label>
   <div class="price"><span>${esc(t('exTime'))}</span><b>₹599</b></div>
   <div class="row-btns"><button class="primary" data-req>${esc(t('exReq'))}</button><button class="ghost" data-close>${esc(t('cancel'))}</button></div>
   <p class="sub" style="margin:14px 0 0;font-size:12.5px">${esc(t('exFiling'))}</p>`);
  md.querySelector('[data-req]').addEventListener('click',async()=>{
    const type=(md.querySelector('input[name=ex]:checked')||{}).value||'ip_attorney';
    let tid='';
    try{const r=await fetch(API+'/api/escalate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:(res&&res.question)||lastQ,answer:res&&res.answer,expert_type:type,language:LANG,confidence:res&&res.confidence?res.confidence.score:null})});
      if(r.ok)tid=(await r.json()).ticket_id||'';}catch(e){}
    openModal(`<h3>${esc(t('doneH'))}</h3><p class="sub">${esc(t('doneSub'))}</p>${tid?`<p class="sub"><b>${esc(t('ticket'))}: ${esc(tid)}</b></p>`:''}<div class="row-btns"><button class="primary" data-close>${esc(t('done'))}</button></div>`);
  });
}
function openPro(){
  openModal(`<h3>${esc(t('proH'))}</h3><p class="sub">${esc(t('proSub'))}</p>
   <div class="result"><dl><div><dt>${esc(t('included'))}</dt><dd>${esc(t('proList'))}</dd></div></dl></div>
   <div class="price"><span>${esc(t('proPrice'))}</span><b>₹499</b></div>
   <div class="row-btns"><button class="primary" data-close>${esc(t('startPro'))}</button><button class="ghost" data-close>${esc(t('stayFree'))}</button></div>`);}
function linkRow(u,title,sub){return `<a href="${u}" target="_blank" rel="noopener"><div><b>${esc(title)}</b><span>${esc(sub)}</span></div><span>${esc(t('open'))}</span></a>`;}
function openPrior(){openModal(`<h3>${esc(t('priorH'))}</h3><p class="sub">${esc(t('priorSub'))}</p><div class="links">${linkRow('https://www.tkdl.res.in','Traditional Knowledge Digital Library',t('pTk'))}${linkRow('https://www.lens.org','The Lens',t('pLens'))}${linkRow('https://patents.google.com','Google Patents',t('pGp'))}${linkRow('https://pubmed.ncbi.nlm.nih.gov','PubMed',t('pPub'))}</div>`);}
function openForms(){openModal(`<h3>${esc(t('formsH'))}</h3><p class="sub">${esc(t('formsSub'))}</p><div class="links">${linkRow('https://ipindia.gov.in','IP India',t('fIp'))}${linkRow('https://nbaindia.org',t('fNbaT'),t('fNba'))}${linkRow('https://ayush.gov.in',t('fAyT'),t('fAy'))}${linkRow('https://foscos.fssai.gov.in','FSSAI FoSCoS',t('fFs'))}${linkRow('https://www.wipo.int','WIPO',t('fWi'))}</div>`);}

/* ---------- Pro features ---------- */
function howFound(res){
  const tm=res.timings||{},cm=t('cragMap')||{};
  const qs=(res.queries||[]).slice(0,5).map(q=>`<li>${esc(q)}</li>`).join('');
  return `<details class="how"><summary>${esc(t('howFound'))}</summary><dl>
   <dt>${esc(t('cragL'))}</dt><dd>${esc(cm[res.crag_status]||res.crag_status||'')}${res.crag_attempts?`, ${res.crag_attempts} ${esc(t('attempts'))}`:''}</dd>
   <dt>${esc(t('langL'))}</dt><dd>${esc(res.language_name||res.language||'')}</dd>
   ${tm.total?`<dt>${esc(t('took'))}</dt><dd>${tm.total}s</dd>`:''}
   ${res.removed_unsupported_claims?`<dt>${esc(t('removed'))}</dt><dd>${res.removed_unsupported_claims}</dd>`:''}
   ${qs?`<dt>${esc(t('qUsed'))}</dt><dd><ul>${qs}</ul></dd>`:''}
  </dl></details>`;
}
function docsUsed(res){
  const srcs=res.sources||[];if(!srcs.length)return'';
  const groups=[];const byKey={};
  srcs.forEach(s=>{const k=s.source_file||s.title||s.label;if(!byKey[k]){byKey[k]={k,title:s.title||s.label,file:s.source_file||'',j:s.jurisdiction,cur:s.is_current,url:s.url,items:[]};groups.push(byKey[k]);}byKey[k].items.push(s);});
  return `<div class="used"><div class="used-h">${esc(t('docsUsed'))} <span>${groups.length} ${esc(t('pdfs'))}</span></div>${groups.map(g=>{
    const first=g.items[0],fu=fileUrl(first);
    const ext=(g.file.split('.').pop()||'doc').slice(0,4).toUpperCase();
    return `<div class="used-doc"><div class="pdf-ic">${esc(ext)}</div><div class="ud-main"><b>${esc(g.title)}<span class="ud-tags"><span class="pill ${g.j==='INTL'?'intl':''}">${esc(t(g.j==='INTL'?'pIntl':'pIn'))}</span>${g.cur?'':`<span class="pill warn">${esc(t('oldVer'))}</span>`}</span></b>${g.file?`<span class="ud-file">${esc(g.file)}</span>`:''}
      <div class="ud-cites">${g.items.map(s=>`<button data-n="${s.n}" title="${esc(s.label)}"><b>${s.n}</b>${esc([s.section&&s.section!=='Preamble'?s.section:'',s.pages?'p. '+s.pages:''].filter(Boolean).join(', ')||s.label)}</button>`).join('')}</div></div>
      ${fu?`<a class="ud-open" href="${esc(fu)}" target="_blank" rel="noopener">${esc(t('open'))}</a>`:(g.url?`<a class="ud-open" href="${esc(g.url)}" target="_blank" rel="noopener">${esc(t('open'))}</a>`:'')}</div>`;}).join('')}</div>`;
}
function pageOf(s){const m=String(s.pages||'').match(/\d+/);return m?m[0]:'';}
function fileUrl(s){return s.source_file?API+'/api/files/'+encodeURIComponent(s.source_file)+(pageOf(s)?'#page='+pageOf(s):''):'';}
function openSource(s){
  if(!s)return;const fu=fileUrl(s);
  openModal(`<h3>${esc(s.title||s.label)}</h3><p class="sub">${esc(srcLine(s))}</p>
   <div class="meta" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"><span class="pill ${s.jurisdiction==='INTL'?'intl':''}">${esc(t(s.jurisdiction==='INTL'?'pIntl':'pIn'))}</span>${s.is_current?`<span class="pill">${esc(t('pCur'))}</span>`:`<span class="pill warn">${esc(t('oldVer'))}</span>`}</div>
   <p class="sub" style="margin:0 0 6px;font-weight:600;color:var(--ink)">${esc(t('excerptL'))}</p>
   <div class="excerpt">${esc(s.excerpt||'')}</div>
   <div class="row-btns" style="margin-top:16px">${fu?`<a class="primary" style="text-decoration:none;display:inline-block" href="${esc(fu)}" target="_blank" rel="noopener">${esc(t('openPdf'))}</a>`:''}${s.url?`<a class="ghost" style="text-decoration:none;display:inline-block;color:var(--ink)" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(t('pOff'))}</a>`:''}</div>`);
  md.classList.add('wide');
}
async function sendFeedback(res,rating,card){
  res._fb=rating;card.querySelectorAll('[data-fb]').forEach(b=>b.classList.toggle('on',b.dataset.fb===rating));
  toast(t('thanks'));
  try{await fetch(API+'/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:res.question,answer:res.answer,rating,confidence:res.confidence&&res.confidence.score,language:res.language})});}catch(e){}
  persistHistory();
}
/* History (chat history section is intentionally not translated) */
function persistHistory(){try{localStorage.setItem(HKEY,JSON.stringify(history.slice(0,30)));}catch(e){}}
function saveHistory(q,res){history=history.filter(h=>h.q!==q);history.unshift({q,res,ts:Date.now()});history=history.slice(0,30);persistHistory();renderHistory();}
function renderHistory(){
  const nav=$('recent');
  if(!history.length){nav.innerHTML='<div class="empty-hist">Your questions will appear here.</div>';return;}
  nav.innerHTML=history.slice(0,12).map((h,i)=>`<button data-h="${i}" title="${esc(h.q)}"><span class="hist">${esc(h.q)}</span></button>`).join('');
  nav.querySelectorAll('[data-h]').forEach(b=>b.addEventListener('click',()=>{closeSide();loadHistory(history[+b.dataset.h]);}));
}
function loadHistory(h){
  if(!h||busy)return;
  msgs.innerHTML='';cards.length=0;$('welcome').style.display='none';
  if(h.res.language&&T[h.res.language])setLang(h.res.language);
  const u=document.createElement('div');u.className='msg user';u.innerHTML=`<div class="bubble">${esc(h.q)}</div>`;msgs.appendChild(u);
  const m=document.createElement('div');m.className='msg bot';m.innerHTML=AV+'<div class="card"></div>';msgs.appendChild(m);
  const card=m.querySelector('.card');cards.push({card,res:h.res});lastRes=h.res;lastQ=h.q;renderAnswer(card,h.res,false);curRes=h.res;renderSources(h.res);scrollEnd();
}
/* Library */
async function openLibrary(){
  openModal(`<h3>${esc(t('library'))}</h3><p class="sub">${esc(t('libSub'))}</p><div class="doclist" id="doclist"><div class="pipe"><div class="on"><span class="dot"></span>…</div></div></div>`);md.classList.add('wide');
  try{const docs=await (await fetch(API+'/api/documents')).json();
    const el=$('doclist');if(!el)return;
    el.innerHTML=docs.map(d=>`<div class="doc"><div style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1;min-width:0"><b>${esc(d.title||d.doc_id)}</b><span class="sec" style="display:block;font-size:12.5px;color:var(--ink-3)">${esc(d.source_file||'')}, ${d.chunks} ${esc(t('chunksN'))}${d.num_pages?`, ${d.num_pages} pp.`:''}</span></div>
      ${d.source_file?`<a href="${API}/api/files/${encodeURIComponent(d.source_file)}" target="_blank" rel="noopener" style="font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap">${esc(t('open'))}</a>`:''}</div>
      <div class="meta" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><span class="pill ${d.jurisdiction==='INTL'?'intl':''}">${esc(t(d.jurisdiction==='INTL'?'pIntl':'pIn'))}</span>${d.is_current?`<span class="pill">${esc(t('pCur'))}</span>`:`<span class="pill warn">${esc(t('oldVer'))}</span>`}${d.regime?`<span class="pill" style="background:var(--surface-2);color:var(--ink-2)">${esc(d.regime)}</span>`:''}</div></div>`).join('')||`<div class="empty-note">—</div>`;
  }catch(e){const el=$('doclist');if(el)el.innerHTML=`<div class="escal"><p>${esc(t('err'))}</p></div>`;}
}
/* Expert desk */
async function openDesk(){
  openModal(`<h3>${esc(t('expertDesk'))}</h3><p class="sub">${esc(t('deskSub'))}</p><div id="tickets"></div>`);md.classList.add('wide');
  let rows=[];try{rows=await (await fetch(API+'/api/escalations')).json();}catch(e){$('tickets').innerHTML=`<div class="escal"><p>${esc(t('err'))}</p></div>`;return;}
  const el=$('tickets');if(!el)return;
  if(!rows.length){el.innerHTML=`<div class="empty-note">${esc(t('noTickets'))}</div>`;return;}
  el.innerHTML=rows.slice().reverse().map(r=>`<div class="doc ticket"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="font-size:13px">#${esc(r.ticket_id)}</b><span class="pill ${r.status==='resolved'?'':'warn'}">${esc(t(r.status==='resolved'?'statusResolved':'statusOpen'))}</span><span style="font-size:12px;color:var(--ink-3);margin-left:auto">${esc((r.created_at||'').replace('T',' '))}</span></div>
    <p style="margin:8px 0 4px;font-size:14.5px">${esc(r.question)}</p>
    ${r.status==='resolved'?`<p class="sub" style="margin:6px 0 0"><b>${esc(t('reply'))}:</b> ${esc(r.reply)}</p>`:
    `<textarea data-reply="${esc(r.ticket_id)}" rows="2" placeholder="${esc(t('replyPh'))}" style="width:100%;margin-top:8px;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;resize:vertical;background:#fff"></textarea><div class="row-btns" style="margin-top:8px"><button class="ghost" data-resolve="${esc(r.ticket_id)}" style="padding:7px 12px;font-size:13px">${esc(t('sendReply'))}</button></div>`}</div>`).join('');
  el.querySelectorAll('[data-resolve]').forEach(b=>b.addEventListener('click',async()=>{
    const id=b.dataset.resolve,ta=el.querySelector(`[data-reply="${id}"]`);if(!ta||!ta.value.trim()){ta&&ta.focus();return;}
    try{await fetch(API+`/api/escalations/${id}/resolve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reply:ta.value.trim()})});}catch(e){}
    openDesk();
  }));
}
/* Server status */
async function checkHealth(){
  const chip=$('status'),txt=$('statusText');
  try{const h=await (await fetch(API+'/api/health')).json();
    if(h.status!=='ok')throw 0;
    let nd='';try{const docs=await (await fetch(API+'/api/documents')).json();nd=docs.filter(d=>d.is_current).length;}catch(e){}
    chip.className='chip';chip.dataset.nd=nd;chip.dataset.nc=h.chunks;
    txt.textContent=`${t('online')}, ${nd} ${t('docsN')}, ${h.chunks} ${t('chunksN')}`;
  }catch(e){chip.className='chip off';txt.textContent=t('offline');}
}
function refreshStatusText(){const chip=$('status');if(!chip)return;if(chip.classList.contains('off'))$('statusText').textContent=t('offline');else if(chip.dataset.nc)$('statusText').textContent=`${t('online')}, ${chip.dataset.nd} ${t('docsN')}, ${chip.dataset.nc} ${t('chunksN')}`;}

let tt;function toast(m){const x=$('toast');x.textContent=m;x.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>x.classList.remove('show'),2600);}
applyLang();renderHistory();checkHealth();setInterval(checkHealth,30000);
})();
